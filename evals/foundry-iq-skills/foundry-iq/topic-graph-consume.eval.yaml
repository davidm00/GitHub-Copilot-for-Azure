name: topic-graph-consume-integration-eval
description: |
  Integration evaluation for the topic-graph-consume skill.
  Tests skill routing: browse a published Topic Graph topic index read-only.

tags:
  type: integration
  skill: foundry-iq

defaults:
  runs: 5
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  - name: "Browse topics in a published Topic Graph build"
    prompt: "What topics does my published Topic Graph corpus cover? List the biggest communities with a few example articles."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Diagnose blocked Topic Graph browsing"
    prompt: "I cannot read my Topic Graph index. Check my descriptor, sign-in and reader access."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Rank a topic's most typical articles"
    prompt: "Show the most typical articles in one Topic Graph community and check whether my question's premise matches that evidence."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Negative (topic-graph-consume): request outside foundry-iq"
    prompt: "Query Azure Monitor Application Insights for failed HTTP requests over the last 24 hours."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - foundry-iq
