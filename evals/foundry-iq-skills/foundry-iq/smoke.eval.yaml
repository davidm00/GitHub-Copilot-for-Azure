name: foundry-iq-routing-smoke-eval
description: Smoke coverage for the primary Foundry IQ knowledge-base route.

tags:
  skill: foundry-iq

defaults:
  runs: 5
  timeout: "5m"
  executor: integration-test-agent-runner
  model: claude-sonnet-4.6

scoring:
  threshold: 0.8

stimuli:
  - name: "Create a Foundry IQ knowledge base"
    prompt: "Create a Foundry IQ knowledge base from my product documentation."
    tags:
      type: trigger
      tier: smoke
      cost: llm
      area: routing
      requiredSkills:
        - foundry-iq
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    constraints:
      max_turns: 4
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
