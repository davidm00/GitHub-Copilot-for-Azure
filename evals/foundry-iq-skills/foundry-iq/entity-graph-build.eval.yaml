name: entity-graph-build-integration-eval
description: |
  Integration evaluation for the entity-graph-build skill.
  Tests skill routing: plan, apply and check an Enterprise Knowledge Graph build.

tags:
  type: integration
  skill: foundry-iq

defaults:
  runs: 5
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  - name: "Plan an Entity Graph build from a corpus and OWL ontology"
    prompt: "I have a folder of contracts and an OWL ontology. Plan an Enterprise Knowledge Graph build on Azure AI Search and show me the plan before applying anything."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Check Entity Graph build status"
    prompt: "What is the status and progress of my Enterprise Knowledge Graph build? Include timings."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Refresh an Entity Graph with Schema.org types"
    prompt: "Refresh my Entity Graph with the updated documents, using Schema.org as the ontology."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Negative (entity-graph-build): request outside foundry-iq"
    prompt: "Deploy an Azure Kubernetes Service cluster with managed Prometheus monitoring."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - foundry-iq
