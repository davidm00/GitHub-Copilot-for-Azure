name: topic-graph-build-integration-eval
description: |
  Integration evaluation for the topic-graph-build skill.
  Tests skill routing: plan, apply, verify, publish and retire a Topic Graph topic index build.

tags:
  type: integration
  skill: foundry-iq

defaults:
  runs: 5
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  - name: "Plan a Topic Graph build from a source index"
    prompt: "I have an Azure AI Search index of public documents with stored chunk vectors. Plan a Topic Graph community build and show me the approval card before applying anything."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Publish a verified Topic Graph generation"
    prompt: "The Topic Graph generation verified cleanly. Publish it and tell me which readers keep access."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Retire a superseded Topic Graph generation"
    prompt: "My Topic Graph apply timed out earlier. Reconcile it, then plan retiring the superseded generation."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Negative (topic-graph-build): request outside foundry-iq"
    prompt: "Configure diagnostic settings to stream Azure Key Vault audit logs to Log Analytics."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - foundry-iq
