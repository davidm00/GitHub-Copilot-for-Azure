name: grounding-consume-integration-eval
description: |
  Integration evaluation for the grounding-consume skill.
  Tests skill routing: Check, inspect, and sample an existing grounding index in Azure AI Search, read-only.

tags:
  type: integration
  skill: foundry-iq

defaults:
  runs: 5
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  - name: "Check a grounding index and sample edges"
    prompt: "Check my grounding index for problems and sample a few edges."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      requiredSkills: [foundry-iq]
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "List predicates and graph names in a grounding index"
    prompt: "Which predicates and graph names are in this grounding index?"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      requiredSkills: [foundry-iq]
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Explain an unmapped grounding profile role"
    prompt: "Why does check say a graph profile role is unmapped?"
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      requiredSkills: [foundry-iq]
      earlyTerminate: '[{"type":"skill-call","skill":"foundry-iq"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - foundry-iq
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Negative (grounding-consume): request outside foundry-iq"
    prompt: "List active consumer groups on an Azure Event Hubs namespace."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
      requiredSkills: [foundry-iq]
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - foundry-iq
